name: Keep Render Bot Awake

on:
  schedule:
    # Har 10 daqiqada ishga tushadi (Render 15 daqiqalik uyqu limitidan oldin)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          response=$(curl -s -w "%{http_code}" -o /dev/null --max-time 45 https://quiz-tuzdim-bot.onrender.com/health)
          echo "Render HTTP Status: $response"
          if [ "$response" -eq 200 ]; then
            echo "✅ Render bot uyg'oq va sog'lom! (Status 200 OK)"
          else
            echo "⚠️ Kutilmagan status kodi: $response"
          fi
